name: sync upstream

# Daily: merge jank-lang/clojure-test-suite main into a sync branch, open a PR
# and dispatch the tests workflow on it. A conflicting merge opens an issue.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  sync:
    if: github.repository != 'jank-lang/clojure-test-suite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/jank-lang/clojure-test-suite.git
          git fetch upstream main

      - name: Merge upstream main into a sync branch
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" = "0" ]; then
            echo "main already contains upstream/main"
            exit 0
          fi
          upstream_sha=$(git rev-parse --short upstream/main)
          branch="sync/upstream-$upstream_sha"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already pushed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            gh issue create \
              --title "Upstream sync conflict at $upstream_sha" \
              --body "Merging jank-lang/clojure-test-suite main ($upstream_sha, $behind commits) into main conflicts. Resolve it by hand: git fetch upstream && git merge upstream/main."
            exit 1
          fi
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Sync upstream main ($upstream_sha)" \
            --body "Merges $behind upstream commits from jank-lang/clojure-test-suite main. The tests workflow is dispatched on $branch, so every dialect suite runs against them."
          gh workflow run ci.yml --ref "$branch"
